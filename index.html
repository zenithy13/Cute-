        body { font-family: 'Mitr', sans-serif; background-color: #f9fbff; overflow-x: hidden; color: #2b5f9e; }
        .font-eng { font-family: 'Fredoka', sans-serif; }
        .shape-header { border-radius: 40px 100px 100px 40px; position: relative; }
        .shape-info { border-radius: 20px; }
        .shape-bubble-left { border-radius: 20px; position: relative; }
        .shape-bubble-left::after { content: ''; position: absolute; right: -15px; top: 50%; transform: translateY(-50%); border-width: 15px 0 15px 20px; border-color: transparent transparent transparent #81c3fd; }
        .shape-nota { border-radius: 20px; position: relative; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #bde0fe; border-radius: 10px; }
        .modal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal.active { opacity: 1; visibility: visible; }
        .modal.inactive { opacity: 0; visibility: hidden; }
        .modal-content { transition: transform 0.3s ease; transform: scale(0.95); }
        .modal.active .modal-content { transform: scale(1); }
        .bg-shapes { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; }
    </style>
