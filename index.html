<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zenithy Shop - Web Design</title>
   
    <!-- นำเข้า Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
   
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
   
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#F4FAFF',
                            base: '#8CD1FC',
                            dark: '#462B21',
                            accent: '#DDF0FF',
                            white: 'rgba(255, 255, 255, 0.85)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body, div, span, applet, object, iframe, h1, h2, h3, h4, h5, h6, p, blockquote, pre, a, abbr, acronym, address, big, cite, code, del, dfn, em, img, ins, kbd, q, s, samp, small, strike, strong, sub, sup, tt, var, b, u, i, center, dl, dt, dd, ol, ul, li, fieldset, form, label, legend, table, caption, tbody, tfoot, textad, th, td, article, aside, canvas, details, embed, figure, figcaption, footer, header, hgroup, menu, nav, output, ruby, section, summary, time, mark, audio, video, button, input, textarea, select { font-family: 'Mitr', sans-serif !important; color: #462B21; }
        .font-eng { font-family: 'Fredoka', sans-serif !important; }
        body { background-color: #F4FAFF; background-image: radial-gradient(at 10% 0%, #DDF0FF 0px, transparent 50%), radial-gradient(at 90% 10%, #8CD1FC 0px, transparent 50%), radial-gradient(at 50% 90%, #F7EDE2 0px, transparent 50%); background-attachment: fixed; min-height: 100vh; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .container-box { max-width: 500px; margin: 0 auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .bento-card { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 4px 30px rgba(140, 209, 252, 0.15); }
        .floating-nav { position: sticky; top: 1rem; z-index: 50; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 999px; padding: 0.5rem 1rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(70, 43, 33, 0.08); margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container-box">
        <!-- Navbar -->
        <nav class="floating-nav">
            <span class="font-eng font-semibold text-lg text-brand-dark tracking-wide pl-2">Zenithy</span>
            <div class="flex gap-2 font-eng text-sm">
                <a href="#work" class="px-3 py-1.5 rounded-full hover:bg-brand-accent/50 transition font-medium">Work</a>
                <a href="#price" class="px-3 py-1.5 rounded-full hover:bg-brand-accent/50 transition font-medium">Price</a>
                <a href="#contact" class="px-3 py-1.5 bg-brand-base text-brand-dark rounded-full font-medium">Contact</a>
            </div>
        </nav>

        <!-- Header -->
        <header class="bento-card text-center">
            <div class="w-24 h-24 mx-auto mb-4 rounded-full overflow-hidden border-[3px] border-white shadow-sm bg-brand-accent/30 flex items-center justify-center">
                <img src="IMG_0545.jpeg" alt="Shop Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="font-eng text-[2.5rem] leading-[1.1] font-bold text-brand-dark mb-1 tracking-tight">Zenithy</h1>
            <p class="font-eng text-xl text-brand-base font-semibold mb-4 tracking-widest uppercase">Shop</p>
            <p class="text-sm leading-relaxed text-brand-dark/80">รับทำเว็บไซต์ร้านค้าสำหรับร้านปล่อยเช่า / ป้าย / เติมเกม</p>
        </header>

        <!-- Pricing Section -->
        <div id="price" class="grid grid-cols-2 gap-4">
            <div class="bento-card flex flex-col justify-center items-center text-center p-5">
                <p class="font-eng text-xs text-brand-dark/60 font-semibold uppercase tracking-wider mb-1">Price</p>
                <div class="flex items-baseline gap-1 mb-2">
                    <span class="text-4xl font-bold text-brand-dark">99</span>
                    <span class="text-xs font-medium">.-</span>
                </div>
            </div>
            <div class="bento-card flex flex-col justify-center p-4">
                <h3 class="text-sm font-semibold mb-2">ฟีเจอร์เว็บไซต์</h3>
                <ul class="text-[11px] space-y-1.5 text-brand-dark/80">
                    <li>✓ รวมลิงก์งาน/เช็คคิว</li>
                    <li>✓ ใส่เรทราคา/ช่องทางติดต่อ</li>
                    <li>✓ เว็บบัญชีคัดลอกเลขได้</li>
                </ul>
            </div>
        </div>

        <!-- Contact Section -->
        <div id="contact" class="bento-card">
            <h2 class="text-lg font-semibold mb-4 border-b border-brand-accent pb-2">ช่องทางติดต่อ</h2>
            <div class="grid grid-cols-2 gap-3">
                <a href="https://www.facebook.com/zenithy13" target="_blank" class="bg-white/60 p-4 rounded-xl text-center font-medium text-sm hover:bg-brand-accent transition border border-brand-accent/30">
                    Facebook
                </a>
                <a href="https://line.me/ti/p/LfBtdhlrVa" target="_blank" class="bg-white/60 p-4 rounded-xl text-center font-medium text-sm hover:bg-brand-accent transition border border-brand-accent/30">
                    Line
                </a>
            </div>
        </div>
        
        <footer class="text-center text-[10px] text-brand-dark/50 font-eng pb-6">&copy; 2026 Zenithy Shop.</footer>
    </div>
</body>
</html>
